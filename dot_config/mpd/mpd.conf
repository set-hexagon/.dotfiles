music_directory    "~/Music"
playlist_directory "~/.local/share/mpd/playlists"
db_file            "~/.local/share/mpd/database"
log_file           "~/.local/share/mpd/log"
pid_file           "~/.local/share/mpd/pid"
state_file         "~/.local/share/mpd/state"

# Connect via PipeWire / PipeWire-Pulse (default for modern Arch)
audio_output {
    type        "pulse"
    name        "PulseAudio / PipeWire Sound Server"
}

# Visualizer output (optional, useful if using rmpc/cava)
audio_output {
    type        "fifo"
    name        "Visualizer feed"
    path        "/tmp/mpd.fifo"
    format      "44100:16:2"
}
